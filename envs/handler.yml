# envs/handler.yml — the worker's conda environment (environments.map: handler).
#
# Captured 2026-11-11 on Ludwig from the working developer environment `segflow4d`
# (conda 25.1.1, Python 3.10.19, torch 2.5.1+cu121). The raw captures are kept next
# to this file in envs/handler.export/ — this file is assembled from them, because
# neither `conda env export` form rebuilds on its own:
#   - the full export's pip section silently DROPS packages (vtk, itk-*, nibabel,
#     scikit-image, matplotlib, picsl-* were missing); `pip freeze` is the truth;
#   - it lists three things no index can serve: `fireants` (installed from a local
#     clone), `fireants-fused-ops` (a CUDA extension compiled on the box) and
#     `segflow4d` (an editable checkout);
#   - torch +cu121 wheels live on download.pytorch.org, not PyPI;
#   - --from-history holds only python and the three CUDA toolkit packages.
#
# So this file carries: the conda packages with their exact builds (python, and the
# CUDA 12.1 compiler + headers that the fused-ops build needs), and every pip
# package at its exact version. NOT in this file, installed afterwards as pinned
# components (versions.lock / components.map), always with --no-deps so nothing
# here can drift:
#   FireANTs     fireants 1.4.0 + fireants_fused_ops 1.2.0, built by install/build-fireants.sh
#   segflow4d    pip install --no-deps -e
#   avrp-handler pip install --no-deps -e   (ipython and watchdog below are its
#                declared dependencies; the developer environment never had them
#                because the handler was not pip-installed there)
#
# Changing this file is an upgrade: scripts/upgrade.sh rebuilds the environment.
