<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2933"/></marker></defs><rect width="960" height="420" fill="#ffffff"/><rect x="20" y="30" width="150" height="96" rx="8" fill="#eef2ff" stroke="#4c51bf" stroke-width="1.6"/><text x="95.0" y="52" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">1  Upload</text><text x="95.0" y="71" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">a person creates a</text><text x="95.0" y="87" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">case and uploads</text><text x="95.0" y="103" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">a 4D image</text><text x="95.0" y="119" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">(Manager)</text><rect x="200" y="30" width="170" height="96" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/><text x="285.0" y="52" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">2  Queue</text><text x="285.0" y="71" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">the gateway stores the</text><text x="285.0" y="87" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">image and lists the</text><text x="285.0" y="103" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">steps to run</text><text x="285.0" y="119" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">(database)</text><line x1="170" y1="78" x2="198" y2="78" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><line x1="370" y1="78" x2="408" y2="78" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><rect x="410" y="10" width="530" height="300" rx="10" fill="none" stroke="#7b8794" stroke-width="1.4" stroke-dasharray="7 5"/><text x="422" y="28" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start" font-style="italic">3  The worker runs the steps; each starts when what it needs is completed</text><rect x="430" y="44" width="150" height="62" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="505.0" y="66" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">Phase detection</text><text x="505.0" y="85" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">finds open / closed</text><text x="505.0" y="101" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">valve frames</text><rect x="600" y="44" width="150" height="62" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="675.0" y="66" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">Auto-segmentation</text><text x="675.0" y="85" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">outlines the valve</text><text x="675.0" y="101" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">in those frames</text><rect x="770" y="44" width="150" height="62" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="845.0" y="66" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">Study generator</text><text x="845.0" y="85" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">tracks it through the</text><text x="845.0" y="101" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">heartbeat, builds 3D</text><line x1="580" y1="75" x2="598" y2="75" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><line x1="750" y1="75" x2="768" y2="75" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><text x="505" y="124" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#6d28d9" text-anchor="middle">uses the GPU</text><text x="675" y="124" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#6d28d9" text-anchor="middle">uses the GPU</text><text x="845" y="124" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11" font-weight="bold" fill="#6d28d9" text-anchor="middle">uses the GPU</text><path d="M845,134 L845,180" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><text x="430" y="172" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">then four measurement steps, at the same time</text><line x1="430" y1="182" x2="916" y2="182" stroke="#1f2933" stroke-width="1.5"/><rect x="430" y="190" width="114" height="56" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="487.0" y="212" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">Global</text><text x="487.0" y="231" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">measurements</text><rect x="554" y="190" width="114" height="56" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="611.0" y="212" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">Time-point</text><text x="611.0" y="231" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">measurements</text><rect x="678" y="190" width="114" height="56" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="735.0" y="212" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">Root strain</text><rect x="802" y="190" width="114" height="56" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="859.0" y="212" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">Root diameter</text><text x="675" y="272" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="middle">Each step downloads what it needs from the gateway, works in scratch space,</text><text x="675" y="288" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="middle">uploads its results, and marks itself completed (or failed, with the reason).</text><rect x="200" y="180" width="170" height="96" rx="8" fill="#eef2ff" stroke="#4c51bf" stroke-width="1.6"/><text x="285.0" y="202" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">4  View</text><text x="285.0" y="221" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">“Open Viewer” unlocks</text><text x="285.0" y="237" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">when the Study</text><text x="285.0" y="253" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">generator is done</text><text x="285.0" y="269" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">(web viewer, iPad)</text><path d="M430,218 L372,218" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><rect x="20" y="180" width="150" height="96" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/><text x="95.0" y="202" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Status</text><text x="95.0" y="221" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">the Manager shows</text><text x="95.0" y="237" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">each step: waiting,</text><text x="95.0" y="253" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">running, completed,</text><text x="95.0" y="269" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">failed</text><path d="M198,228 L172,228" fill="none" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><text x="20" y="340" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2933" text-anchor="start">A study is finished when all seven steps say “completed”.  On the server:  scripts/study-status.sh &lt;study id&gt;</text><text x="20" y="362" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">The 12-frame ultrasound test study took 5 minutes on the RTX 2080 (one run, 2026-11-13).</text><rect x="20" y="389" width="16" height="14" rx="3" fill="#eef2ff" stroke="#4c51bf" stroke-width="1.4"/><text x="43" y="400" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">a person does this</text><rect x="180.2" y="389" width="16" height="14" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><text x="203.2" y="400" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">stored</text><rect x="257.6" y="389" width="16" height="14" rx="3" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.4"/><text x="280.6" y="400" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">pipeline step</text><rect x="383.3" y="389" width="16" height="14" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="406.3" y="400" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">information</text></svg>
