<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2933"/></marker></defs><rect width="960" height="600" fill="#ffffff"/><text x="20" y="26" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">Where everything lives, and which account owns it</text><rect x="14" y="44" width="300" height="500" rx="10" fill="none" stroke="#4c51bf" stroke-width="1.4"/><text x="164" y="68" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">You (the operator)</text><text x="164" y="86" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">a person with sudo</text><rect x="28" y="102" width="272" height="150" rx="8" fill="#eef2ff" stroke="#4c51bf" stroke-width="1.6"/><text x="164.0" y="124" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">/opt/valvescope/valvescope-deploy</text><text x="164.0" y="143" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">the deployment repository:</text><text x="164.0" y="159" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">scripts, pinned versions,</text><text x="164.0" y="175" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">environment and model lists,</text><text x="164.0" y="191" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">this guide</text><rect x="28" y="266" width="272" height="88" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/><text x="164.0" y="288" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">config/deploy.env</text><text x="164.0" y="307" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">the one settings file you edit;</text><text x="164.0" y="323" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">holds the generated secrets</text><text x="164.0" y="339" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">(readable by you only)</text><rect x="28" y="368" width="272" height="88" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/><text x="164.0" y="390" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">config/accounts.txt</text><text x="164.0" y="409" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">people&#x27;s usernames and their</text><text x="164.0" y="425" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">initial passwords</text><text x="164.0" y="441" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">(readable by you only)</text><text x="164" y="486" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">Never read by the services.</text><text x="164" y="504" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">They receive only the files</text><text x="164" y="522" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">generated from deploy.env.</text><rect x="330" y="44" width="400" height="500" rx="10" fill="none" stroke="#0369a1" stroke-width="1.4"/><text x="530" y="68" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">valvescope (the service account)</text><text x="530" y="86" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">cannot log in; runs the five services</text><rect x="344" y="100" width="372" height="42" rx="6" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.4"/><text x="356" y="117" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">/opt/valvescope/src</text><text x="356" y="133" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">the services&#x27; code, at pinned versions (1.3 GB)</text><rect x="344" y="148" width="372" height="42" rx="6" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.4"/><text x="356" y="165" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">/opt/valvescope/miniconda3</text><text x="356" y="181" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">two Python environments (19 GB)</text><rect x="344" y="196" width="372" height="42" rx="6" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.4"/><text x="356" y="213" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">/opt/valvescope/node</text><text x="356" y="229" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">Node.js for gateway and manager</text><rect x="344" y="244" width="372" height="42" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="356" y="261" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">/opt/valvescope/state</text><text x="356" y="277" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">the record of what is installed</text><rect x="344" y="292" width="372" height="42" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="356" y="309" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">/opt/valvescope/etc</text><text x="356" y="325" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">the proxy&#x27;s configuration</text><rect x="344" y="340" width="372" height="42" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><text x="356" y="357" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">/srv/valvescope/data</text><text x="356" y="373" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">FILE STORE — images and results. Keep.</text><rect x="344" y="388" width="372" height="42" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="356" y="405" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">/srv/valvescope/models</text><text x="356" y="421" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">network weights (9 GB), checked by checksum</text><rect x="344" y="436" width="372" height="42" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="356" y="453" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">/srv/valvescope/work</text><text x="356" y="469" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">scratch space; can be emptied</text><rect x="344" y="484" width="372" height="42" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><text x="356" y="501" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12" font-weight="bold" fill="#1f2933" text-anchor="start">/srv/valvescope/backup</text><text x="356" y="517" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">database dumps (same disk today!)</text><rect x="746" y="44" width="200" height="500" rx="10" fill="none" stroke="#64748b" stroke-width="1.4"/><text x="846" y="68" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">The system (root)</text><text x="846" y="86" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">changed only with sudo</text><rect x="758" y="102" width="176" height="120" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/><text x="846.0" y="124" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">/etc/systemd/system</text><text x="846.0" y="143" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">valvescope.target</text><text x="846.0" y="159" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">and five</text><text x="846.0" y="175" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">valvescope-*.service</text><text x="846.0" y="191" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">files</text><rect x="758" y="236" width="176" height="120" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/><text x="846.0" y="258" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">PostgreSQL</text><text x="846.0" y="277" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">the role “valvescope”</text><text x="846.0" y="293" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">and two databases:</text><text x="846.0" y="309" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">vsdb, vsdsdb</text><text x="846.0" y="325" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">KEEP — back up</text><rect x="758" y="370" width="176" height="86" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/><text x="846.0" y="392" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="middle">Installed packages</text><text x="846.0" y="411" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">caddy,</text><text x="846.0" y="427" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">gcc-12 / g++-12</text><text x="846" y="486" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">The firewall (ufw) is</text><text x="846" y="504" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">switched off on Ludwig;</text><text x="846" y="522" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">the install did not change it.</text><rect x="20" y="567" width="16" height="14" rx="3" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="43" y="578" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">secret</text><rect x="97.4" y="567" width="16" height="14" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/><text x="120.4" y="578" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">data to keep and back up</text><rect x="299.0" y="567" width="16" height="14" rx="3" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.4"/><text x="322.0" y="578" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">can be rebuilt from the repository</text><rect x="569.6" y="567" width="16" height="14" rx="3" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="592.6" y="578" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">copied by hand once</text></svg>
