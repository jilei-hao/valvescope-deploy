<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 646" width="960" height="646"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2933"/></marker></defs><rect width="960" height="646" fill="#ffffff"/><rect x="250" y="16" width="190" height="52" rx="8" fill="#eef2ff" stroke="#4c51bf" stroke-width="1.6"/><text x="345.0" y="38" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Web browser</text><text x="345.0" y="57" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">on the lab network</text><rect x="470" y="16" width="190" height="52" rx="8" fill="#eef2ff" stroke="#4c51bf" stroke-width="1.6"/><text x="565.0" y="38" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">iPad app</text><text x="565.0" y="57" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">on the lab network</text><line x1="345" y1="68" x2="345" y2="112" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><line x1="565" y1="68" x2="565" y2="112" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><text x="578" y="95" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">http://10.150.12.82  (port 80 — the only door in)</text><rect x="30" y="114" width="620" height="62" rx="8" fill="#e6fffa" stroke="#0f766e" stroke-width="1.6"/><text x="340.0" y="136" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Reverse proxy  (Caddy)</text><text x="340.0" y="155" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">one address for everything; sends each request to the right service by its path</text><rect x="14" y="216" width="932" height="388" rx="10" fill="none" stroke="#7b8794" stroke-width="1.4" stroke-dasharray="7 5"/><text x="26" y="595" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start" font-style="italic">Inside the server — these listen on the machine itself only; the network cannot reach them directly</text><line x1="125" y1="176" x2="125" y2="240" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><text x="135" y="202" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">address  /</text><line x1="330" y1="176" x2="330" y2="240" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><text x="340" y="202" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">address  /viewer/</text><line x1="535" y1="176" x2="535" y2="240" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><text x="545" y="202" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">address  /api/</text><rect x="30" y="242" width="190" height="86" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="125.0" y="264" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Manager</text><text x="125.0" y="283" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">Next.js