<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2933"/></marker></defs><rect width="960" height="330" fill="#ffffff"/><rect x="20" y="30" width="250" height="108" rx="8" fill="#eef2ff" stroke="#4c51bf" stroke-width="1.6"/><text x="145.0" y="52" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">What we WANT</text><text x="145.0" y="71" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">versions.lock   (code versions)</text><text x="145.0" y="87" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">envs/handler.yml   (Python packages)</text><text x="145.0" y="103" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">models.manifest   (model files)</text><text x="145.0" y="119" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">kept in git</text><rect x="20" y="178" width="250" height="108" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/><text x="145.0" y="200" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">What IS installed</text><text x="145.0" y="219" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">deployed.lock</text><text x="145.0" y="235" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">deployed.envs</text><text x="145.0" y="251" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">deployed.models</text><text x="145.0" y="267" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">in /opt/valvescope/state</text><rect x="340" y="96" width="190" height="124" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="435.0" y="118" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">scripts/upgrade.sh</text><text x="435.0" y="137" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">compares the two</text><text x="435.0" y="153" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">and lists only</text><text x="435.0" y="169" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">what differs</text><text x="435.0" y="185" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle"></text><text x="435.0" y="201" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">--plan: show only</text><line x1="270" y1="84" x2="338" y2="130" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><line x1="270" y1="232" x2="338" y2="190" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><line x1="530" y1="158" x2="578" y2="158" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><rect x="580" y="20" width="360" height="280" rx="10" fill="none" stroke="#7b8794" stroke-width="1.4" stroke-dasharray="7 5"/><text x="592" y="38" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start" font-style="italic">For each thing that changed, one at a time</text><text x="598" y="62" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">1.</text><text x="622" y="62" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2933" text-anchor="start">stop only the services that use it</text><text x="598" y="89" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">2.</text><text x="622" y="89" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2933" text-anchor="start">fetch the new version</text><text x="598" y="116" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">3.</text><text x="622" y="116" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2933" text-anchor="start">reinstall its dependencies</text><text x="598" y="143" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">4.</text><text x="622" y="143" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2933" text-anchor="start">rewrite its settings, rebuild if needed</text><text x="598" y="170" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">5.</text><text x="622" y="170" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2933" text-anchor="start">gateway only: dump the databases,</text><text x="622" y="197" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2933" text-anchor="start">then apply new migrations</text><text x="598" y="224" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">6.</text><text x="622" y="224" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2933" text-anchor="start">start what was stopped</text><text x="598" y="251" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">7.</text><text x="622" y="251" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#1f2933" text-anchor="start">write it down as installed</text><text x="598" y="286" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="start">A failed item is not recorded, so a re-run retries it.</text></svg>
