<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1f2933"/></marker></defs><rect width="960" height="470" fill="#ffffff"/><text x="20" y="26" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2933" text-anchor="start">One machine, two installations that must never touch</text><rect x="14" y="44" width="380" height="290" rx="10" fill="none" stroke="#64748b" stroke-width="1.4"/><text x="204" y="68" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Developer setup</text><text x="204" y="86" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">for writing and testing the software</text><text x="34" y="112" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">Account</text><text x="130" y="112" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">jileihao</text><text x="34" y="142" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">Code</text><text x="130" y="142" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">~/dev/avrp-developer</text><text x="34" y="172" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">Ports</text><text x="130" y="172" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">3000, 8000, 5173</text><text x="34" y="202" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">Databases</text><text x="130" y="202" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">avrpdb, avrpdsdb</text><text x="34" y="232" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">Python</text><text x="130" y="232" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">~/tk/miniconda3</text><text x="34" y="262" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">Node.js</text><text x="130" y="262" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">~/.nvm</text><text x="34" y="292" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">Started</text><text x="130" y="292" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">by hand, in terminals</text><rect x="566" y="44" width="380" height="290" rx="10" fill="none" stroke="#0369a1" stroke-width="1.4"/><text x="756" y="68" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">ValveScope deployment</text><text x="756" y="86" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">what the lab team uses</text><text x="586" y="112" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">Account</text><text x="682" y="112" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">valvescope</text><text x="586" y="142" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">Code</text><text x="682" y="142" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">/opt/valvescope/src</text><text x="586" y="172" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">Ports</text><text x="682" y="172" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">80 (public); 3100, 8100, 5273</text><text x="586" y="202" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">Databases</text><text x="682" y="202" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">vsdb, vsdsdb</text><text x="586" y="232" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">Python</text><text x="682" y="232" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">/opt/valvescope/miniconda3</text><text x="586" y="262" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">Node.js</text><text x="682" y="262" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">/opt/valvescope/node</text><text x="586" y="292" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1f2933" text-anchor="start">Started</text><text x="682" y="292" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">by systemd, at boot</text><text x="480" y="150" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">nothing</text><text x="480" y="168" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">in common</text><line x1="480" y1="180" x2="480" y2="318" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3 5"/><rect x="190" y="362" width="250" height="76" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/><text x="315.0" y="384" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">One PostgreSQL server</text><text x="315.0" y="403" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">both keep their databases here,</text><text x="315.0" y="419" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">under different names and logins</text><rect x="520" y="362" width="250" height="76" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/><text x="645.0" y="384" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">One GPU (8 GB)</text><text x="645.0" y="403" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">two heavy jobs at once can run</text><text x="645.0" y="419" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">out of memory — see Troubleshooting</text><line x1="204" y1="334" x2="290" y2="360" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><line x1="756" y1="334" x2="400" y2="361" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><line x1="250" y1="334" x2="590" y2="361" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><line x1="800" y1="334" x2="680" y2="360" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><text x="480" y="460" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">Shared on purpose: the database server and the graphics card. Everything else is separate.</text></svg>
