# versions.lock — the one known-good set of sources for a ValveScope deployment.
#
# One component per line, whitespace-separated, six columns:
#
#   name   role   url   tag   sha   path
#
#   name  directory the component is checked out to, under the sources dir
#   role  host   = needed on the server; fetched by default
#         client = pinned for the record (built elsewhere); fetched only with --all
#   url   git remote
#   tag   release tag that points at <sha>, or "-" if the commit is not tagged yet
#   sha   full 40-char commit; this is what gets checked out, the tag is only a label
#   path  "-" for a whole repo; otherwise a sub-directory of that repo
#         (used for components that live inside the developer wrapper)
#
# Read by install/fetch-sources.sh. Change pins only through scripts/upgrade.sh
# (once it exists) so the previous set is kept for rollback.
#
# Seeded 2026-11-10 from avrp-developer@main (91d7bbe) `git submodule status`.
# No pinned commit carries a release tag yet — tagging them is a WS-2 to-do.
# NOTE avrp-handler: this commit is on branch fix/handler-concurrency, not on main.
# 2026-11-11: three pins moved to fix branches that are pushed but not merged to main:
#   avrp-gateway       fix/forward-only-migrations        (migrations 006/007, forward-only rule)
#   avrp-manager       fix/viewer-url-configurable        (first commit on which `next build` works)
#   avrp-view-service  feature/gateway-url-and-base-path  (/viewer/ and /api behind the proxy)

